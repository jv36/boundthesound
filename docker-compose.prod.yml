services:
  app:
    build: .
    restart: unless-stopped
    # Not reachable directly from the internet — Caddy proxies to it over the compose network.
    expose:
      - '3000'
    environment:
      APP_URL: ${APP_URL}
      NODE_ENV: production
      PORT: 3000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
